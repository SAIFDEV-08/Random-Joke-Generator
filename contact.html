<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="/Joke App/img/logo.png">
    <link rel="icon-short" type="image/png" href="/Joke App/img/logo.png">
    <link rel="stylesheet" href="contact.css">
    <title>Contact Page</title>
</head>
<body>
    <nav>
        <div class="logo">
            <a href="/Joke App/index.html">
                Joke Generator
            </a>
        </div>
        <i id="menu" class="fa-solid fa-bars" style="color: rgb(241, 241, 241);"></i>
        <div class="links">
            <a href="index.html">
                Home
            </a>
            <a href="/Joke App/About.html">
                About
            </a>
            <a href="https://github.com/SAIFDEV-08" target="_blank">
                GitHub
            </a>
            <a href="/Joke App/contact.html">
                Contact
            </a>
        </div>
    </nav>
    <section>
        <main>
            <form class="container">
                 <header>
                    <h1>Contact Me</h1>
                </header>
                <div class="items">
                    <div class="name form-group">
                        <label for="name">
                            Name:
                        </label>
                        <input id="name" type="text" placeholder="Your Name" required>
                    </div>
                    <div class="email form-group">
                        <label for="email">
                            Email:
                        </label>
                        <input id="email" type="email" placeholder="Your Email" required>
                    </div>
                    <div class="message form-group">
                        <label for="message">
                            Message:
                        </label>
                        <textarea name="message" id="message" cols="25" rows="5"></textarea>
                    </div>
                    <button id="btn" type="submit">Send Message</button>
                </div>
            </form>
        </main>
    </section>
    <footer>
        <p>&copy; 2026 Joke Generator. All rights reserved.</p>
    </footer>
    <script src="contact.js"></script>
</body>
</html>
